<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6e9a5a" />
  <meta name="apple-mobile-web-app-title" content="ひみつきちつくろ" />
  <title>ひみつきちつくろ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%236e9a5a'/%3E%3Ccircle cx='16' cy='14' r='6' fill='%23f3c7a5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <div id="game-root"></div>

  <section id="title-screen">
    <div class="title-card">
      <p class="eyebrow">ブラウザでそのまま</p>
      <h1>ひみつきちつくろ</h1>
      <p class="lead">もりであるいて、ひみつきちをそだてよう</p>
      <ul class="title-points">
        <li>えだ・こいし・きのみは、ちかづくとひろえる</li>
        <li>ひかるきのこは、ボタンでひろう</li>
        <li>スマートフォンはしたのスティック。パソコンは WASD か、やじるしキー</li>
        <li>とじている間は、すすまない</li>
      </ul>
      <button type="button" id="start-btn">はじめる</button>
      <p id="title-note"></p>
      <p class="draw-link"><a href="draw/">えをかく</a></p>
    </div>
  </section>

  <header id="hud">
    <div class="hud-top">
      <p class="logo">ひみつきちつくろ</p>
      <p class="coins" id="coins">コイン 0</p>
      <button type="button" id="btn-settings" data-panel="settings">せってい</button>
    </div>
    <p class="hud-mid">
      <span id="carry-label">もち 0/8</span>
      <span id="storage-label">ほかん 0/16</span>
      <span id="save-label">ほぞん まだ</span>
    </p>
    <p id="status-pill" class="hud-status">あるいて、えだやこいしをあつめよう</p>
  </header>

  <nav class="side-buttons" aria-label="メニュー">
    <button type="button" data-panel="items">もちもの</button>
    <button type="button" data-panel="shop">うる</button>
    <button type="button" data-panel="build">たてる</button>
    <button type="button" data-panel="helpers">なかま</button>
  </nav>

  <div id="stick" aria-hidden="true"><div class="knob"></div></div>
  <button type="button" id="action-btn" hidden>ひかるきのこをひろう</button>
  <div id="toasts" aria-live="polite"></div>

  <div id="scrim" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button type="button" id="panel-close">とじる</button>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>

  <noscript><p>ひみつきちつくろ を遊ぶには、JavaScript をオンにしてください。</p></noscript>

  <script src="vendor/phaser.min.js?v=1"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/layout.js?v=1"></script>
  <script src="js/sim.js?v=1"></script>
  <script src="js/save.js?v=1"></script>
  <script src="js/input.js?v=1"></script>
  <script src="js/sprites.js?v=1"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/game.js?v=2"></script>
</body>
</html>
